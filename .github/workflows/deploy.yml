name: Build and Deploy to AKS

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: flipkartapp
  ACR_NAME: flipkartapp
  AKS_NAME: flipkartaks
  RESOURCE_GROUP: AZ_RSG
  IMAGE_TAG: ${{ github.sha }}

# ============================================================
# Prevent overlapping deployments on the same branch
# ============================================================
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ==========================================================
  # 1. BUILD & PUSH DOCKER IMAGE
  # ==========================================================
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Login to Azure
      # AZURE_CREDENTIALS = Azure Service Principal
      # --------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # --------------------------------------------------------
      # Login to ACR
      # AZURE_ACR_CREDENTIALS JSON contains:
      # username
      # password
      # loginServer
      # --------------------------------------------------------
      - name: Login to Azure Container Registry
        env:
          ACR_CREDENTIALS: ${{ secrets.AZURE_ACR_CREDENTIALS }}
        run: |
          ACR_USERNAME=$(echo "$ACR_CREDENTIALS" | jq -r '.username')
          ACR_PASSWORD=$(echo "$ACR_CREDENTIALS" | jq -r '.password')
          ACR_LOGIN_SERVER=$(echo "$ACR_CREDENTIALS" | jq -r '.loginServer')

          echo "Logging in to ACR: $ACR_LOGIN_SERVER"

          echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" \
            --username "$ACR_USERNAME" \
            --password-stdin


      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------
      - name: Build Docker image
        env:
          ACR_CREDENTIALS: ${{ secrets.AZURE_ACR_CREDENTIALS }}
        run: |
          ACR_LOGIN_SERVER=$(echo "$ACR_CREDENTIALS" | jq -r '.loginServer')

          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            .


      # --------------------------------------------------------
      # Push Docker image
      # --------------------------------------------------------
      - name: Push Docker image
        env:
          ACR_CREDENTIALS: ${{ secrets.AZURE_ACR_CREDENTIALS }}
        run: |
          ACR_LOGIN_SERVER=$(echo "$ACR_CREDENTIALS" | jq -r '.loginServer')

          docker push \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"


      # --------------------------------------------------------
      # Set image output
      # --------------------------------------------------------
      - name: Set image output
        id: image
        env:
          ACR_CREDENTIALS: ${{ secrets.AZURE_ACR_CREDENTIALS }}
        run: |
          ACR_LOGIN_SERVER=$(echo "$ACR_CREDENTIALS" | jq -r '.loginServer')

          echo "image=$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_OUTPUT"


  # ==========================================================
  # 2. TERRAFORM
  # ==========================================================
  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest

    needs: build

    # --------------------------------------------------------
    # ARM_* env vars required by the azurerm Terraform provider
    # and the azurerm backend for state storage
    # --------------------------------------------------------
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID}}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET}}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID}}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID}}

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Azure Login
      # Uses Azure subscription credentials
      # --------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0


      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------
      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -reconfigure \
            -backend-config="resource_group_name=AZ_RSG" \
            -backend-config="storage_account_name=azstoragecontainer" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=aks.terraform"


      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------
      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan -out=tfplan


      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------
      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve tfplan


  # ==========================================================
  # 3. DEPLOY TO AKS
  # ==========================================================
  deploy:
    name: Deploy Application to AKS
    runs-on: ubuntu-latest

    needs: [build, terraform]

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Azure Login
      # Uses Azure subscription credentials
      # --------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # --------------------------------------------------------
      # Get AKS credentials
      # --------------------------------------------------------
      - name: Get AKS credentials
        timeout-minutes: 10
        run: |
          echo "Checking AKS availability..."

          until az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --overwrite-existing 2>/dev/null
          do
            echo "AKS not ready yet..."
            sleep 10
          done

          echo "AKS connected"


      # --------------------------------------------------------
      # Wait for AKS nodes
      # --------------------------------------------------------
      - name: Wait for AKS nodes
        timeout-minutes: 10
        run: |
          until kubectl get nodes | grep -q Ready
          do
            echo "Waiting for nodes..."
            sleep 10
          done

          echo "Nodes ready"


      # --------------------------------------------------------
      # Deploy Kubernetes manifests
      # --------------------------------------------------------
      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f K8s/


      # --------------------------------------------------------
      # Wait for deployment rollout
      # --------------------------------------------------------
      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/flipkart-app \
            --timeout=5m


      # --------------------------------------------------------
      # Get pods
      # --------------------------------------------------------
      - name: Get pods
        run: |
          kubectl get pods


      # --------------------------------------------------------
      # Get services
      # --------------------------------------------------------
      - name: Get services
        run: |
          kubectl get svc


      # --------------------------------------------------------
      # Wait for LoadBalancer IP
      # --------------------------------------------------------
      - name: Wait for LoadBalancer IP
        timeout-minutes: 10
        run: |
          echo "Waiting for LoadBalancer IP..."

          until [ -n "$(kubectl get svc flipkart-service \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')" ]
          do
            echo "LoadBalancer IP not available yet..."
            sleep 10
          done


      # --------------------------------------------------------
      # Get Application URL
      # --------------------------------------------------------
      - name: Get Application URL
        run: |
          LB_IP=$(kubectl get svc flipkart-service \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

          echo "======================================"
          echo "APPLICATION URL: http://$LB_IP"
          echo "======================================"
